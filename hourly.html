<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดการผลิต</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body {
      background-color: #1e3a3f;
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .card {
      background: #ffffff;
      padding: 24px 22px;
      border-radius: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: #0d9488;
      margin: 0;
    }
    .date-badge {
      font-size: 0.85rem;
      color: #475569;
      font-weight: 600;
      background: #f1f5f9;
      padding: 5px 12px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b; font-size: 1rem; }
    
    select, input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.8px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.05rem;
      outline: none;
      background: #fff;
      color: #0f172a;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.2);
    }

    .info-banner {
      background: #e0f2fe;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #0369a1;
      font-weight: 600;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 12px;
    }

    .slot-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .slot-time {
      flex: 2.2;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 11px 8px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
    }
    .slot-lot-select {
      flex: 2.2;
      padding: 11px 6px;
      font-size: 0.88rem;
      border-radius: 14px;
      font-weight: 600;
    }
    .slot-input {
      flex: 1.2;
      padding: 11px 8px;
      text-align: center;
      font-weight: 700;
      border-radius: 14px;
      font-size: 1.1rem;
    }

    .btn-add-lot-midday {
      background: #f0fdf4;
      border: 1.5px dashed #0d9488;
      color: #0d9488;
      font-weight: 600;
      cursor: pointer;
      padding: 11px;
      border-radius: 14px;
      width: 100%;
      font-size: 0.9rem;
      margin-top: 5px;
      margin-bottom: 15px;
    }
    .btn-add-lot-midday:active { background: #dcfce7; }

    .sum-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 14px 18px;
      border-radius: 16px;
      border: 2px dashed #0d9488;
      margin-bottom: 18px;
      font-weight: 600;
      color: #1e293b;
      font-size: 1.05rem;
    }
    .sum-input {
      width: 95px;
      text-align: center;
      background: #fff;
      font-weight: 700;
      color: #0d9488;
      border: 2px solid #0d9488;
      padding: 6px;
      border-radius: 10px;
      font-size: 1.15rem;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-top-row">
    <h2 class="header-title">บันทึกยอดการผลิต</h2>
    <div class="date-badge" id="currentDateDisplay">--/--/----</div>
  </div>

  <form id="hourlyForm">
    <div class="form-group">
      <label for="line">LINE การผลิต</label>
      <select id="line" required onchange="loadLineDetails()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <div id="infoBanner" class="info-banner" style="display:none;">
      <span>🎯 เป้าวัน: <strong id="targetVal">0</strong> ชิ้น</span>
      <span>⏱️ เวลาทำงาน: <strong id="hoursVal">0</strong> ชม.</span>
    </div>

    <div class="form-group">
      <div class="section-title">กรอกยอดผลิตรายชั่วโมง</div>
      <div id="slotsContainer">
        <p style="color: #94a3b8; font-size: 0.95rem; text-align: center; padding: 15px 0;">โปรดเลือก LINE การผลิต</p>
      </div>
    </div>

    <button type="button" class="btn-add-lot-midday" id="btnAddMiddayLot" style="display:none;" onclick="promptNewLotNumber()">
      ➕ สลับรุ่น / กรอกเลข LOT เพิ่มเติม
    </button>

    <div class="sum-box">
      <span>ยอดรวมที่กรอก</span>
      <input type="text" id="totalSum" class="sum-input" value="0" readonly>
      <span>ชิ้น</span>
    </div>

    <div class="form-group">
      <label for="remark">หมายเหตุ / ปัญหาที่พบ</label>
      <textarea id="remark" rows="2" placeholder="ระบุปัญหาที่พบ (ถ้ามี)"></textarea>
    </div>

    <button type="submit" class="btn-submit">บันทึกยอด</button>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwziSYLaDcymEHVXQr_qOP6RmIQDjixVPqWwhAQSOMXs_4zAA-gscpeuR7fJp7DY6yp/exec"; 
  let lineProfile = null;
  let activeModels = []; // เก็บรายชื่อ Model สำหรับ Dropdown
  let masterLotMap = {}; // Map คู่มือ (LOT_Number -> Model)

  const TIME_SLOTS_DEF = [
    { label: "08.30-09.30", endMin: 570 },
    { label: "09.30-10.30", endMin: 630 },
    { label: "10.30-11.30", endMin: 690 },
    { label: "11.30-12.30", endMin: 750 },
    { label: "12.30-13.30", endMin: 810 },
    { label: "13.30-14.30", endMin: 870 },
    { label: "14.30-15.30", endMin: 930 },
    { label: "15.30-16.30", endMin: 990 },
    { label: "16.30-17.30", endMin: 1050 },
    { label: "17.30-18.30", endMin: 1110 },
    { label: "18.30-19.30", endMin: 1170 }
  ];

  function displayCurrentDate() {
    const now = new Date();
    document.getElementById('currentDateDisplay').innerText = now.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  displayCurrentDate();

  async function loadLineDetails() {
    const line = document.getElementById('line').value;
    const slotsContainer = document.getElementById('slotsContainer');
    const infoBanner = document.getElementById('infoBanner');
    const btnAddMiddayLot = document.getElementById('btnAddMiddayLot');

    if (!line) {
      slotsContainer.innerHTML = '<p style="color: #94a3b8; font-size: 0.95rem; text-align: center; padding: 15px 0;">โปรดเลือก LINE การผลิต</p>';
      infoBanner.style.display = 'none';
      btnAddMiddayLot.style.display = 'none';
      return;
    }

    slotsContainer.innerHTML = '<p style="color: #64748b; font-size: 0.95rem; text-align: center; padding: 15px 0;">กำลังโหลดข้อมูล...</p>';

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      activeModels = data.models || [];
      masterLotMap = data.masterMap || {}; // Map ข้อมูล Master_LOT ทั้งหมดจากหลังบ้าน
      const totalHours = Number(data.totalWorkingHours) || 8;
      const targetVal = Number(data.target) || 0;

      if (data.reported) {
        document.getElementById('targetVal').innerText = targetVal.toLocaleString();
        document.getElementById('hoursVal').innerText = totalHours;
        infoBanner.style.display = 'flex';
      } else {
        infoBanner.style.display = 'none';
      }

      btnAddMiddayLot.style.display = 'block';
      generateSmartTimeSlots(totalHours);

    } catch (err) {
      console.error("Error loading line details:", err);
      btnAddMiddayLot.style.display = 'block';
      generateSmartTimeSlots(8);
    }
  }

  // ดึงเฉพาะ 2 ชั่วโมงล่าสุดตามเวลาจริง
  function generateSmartTimeSlots(totalHours) {
    const slotsContainer = document.getElementById('slotsContainer');
    slotsContainer.innerHTML = '';

    const now = new Date();
    const currentMinutes = (now.getHours() * 60) + now.getMinutes();

    let passedSlots = TIME_SLOTS_DEF.filter(slot => currentMinutes >= slot.endMin);
    const maxCount = Math.min(Math.ceil(totalHours), TIME_SLOTS_DEF.length);
    passedSlots = passedSlots.slice(0, maxCount);

    let targetSlots = [];
    if (passedSlots.length > 0) {
      targetSlots = passedSlots.slice(-2);
    } else if (maxCount > 0) {
      targetSlots = [TIME_SLOTS_DEF[0]];
    }

    let modelOptionsHTML = activeModels.length > 0 
      ? activeModels.map(m => `<option value="${m}">${m}</option>`).join('') 
      : '<option value="">-- ไม่พบ Model --</option>';

    targetSlots.forEach(slot => {
      const row = document.createElement('div');
      row.className = 'slot-row';
      row.innerHTML = `
        <div class="slot-time">${slot.label}</div>
        <select class="slot-lot-select input-lot-val">
          ${modelOptionsHTML}
        </select>
        <input type="number" class="slot-input input-val" min="0" placeholder="0" oninput="calculateTotal()">
      `;
      slotsContainer.appendChild(row);
    });

    calculateTotal();
  }

  // คนกรอกเลข LOT -> แปลงเป็น Model (Option A)
  function promptNewLotNumber() {
    const inputLot = prompt("กรุณากรอก 'เลข LOT Number' ที่ต้องการสลับผลิต:");
    if (inputLot && inputLot.trim() !== "") {
      const formattedLot = inputLot.trim().toUpperCase();
      
      // ค้นหาใน Master_LOT Map ว่าตรงกับ Model อะไร (Option A: ถ้าไม่เจอ ใช้เลข LOT ลอยไปก่อน)
      const targetModel = masterLotMap[formattedLot] || formattedLot;

      if (!activeModels.includes(targetModel)) {
        activeModels.push(targetModel);
        
        // เพิ่ม Model ใหม่เข้าไปในทุก Dropdown บนหน้าจอทันที
        const selects = document.querySelectorAll('.input-lot-val');
        selects.forEach(select => {
          const opt = document.createElement('option');
          opt.value = targetModel;
          opt.innerText = targetModel;
          opt.selected = true; // สลับมาเลือกตัวใหม่นี้ให้ทันที
          select.appendChild(opt);
        });
      }
    }
  }

  function calculateTotal() {
    const inputs = document.querySelectorAll('.input-val');
    let total = 0;
    inputs.forEach(input => {
      total += (Number(input.value) || 0);
    });
    document.getElementById('totalSum').value = total.toLocaleString();
  }
</script>

</body>
</html>
