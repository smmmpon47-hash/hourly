<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดการผลิตรายชั่วโมง</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; padding-bottom: 30px; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 15px; }
    .table-break { background-color: #e9ecef; color: #6c757d; font-weight: bold; }
    .btn-submit { background-color: #27ae60; color: white; width: 100%; font-size: 1.1rem; font-weight: bold; padding: 10px; }
    .btn-submit:hover { background-color: #219150; color: white; }
  </style>
</head>
<body>

<div class="container mt-3">
  <div class="card p-3">
    <h4 class="text-center text-primary mb-3">📦 บันทึกยอดการผลิตรายชั่วโมง</h4>
    
    <!-- ส่วนเลือก Line -->
    <div class="mb-3">
      <label for="lineSelect" class="form-label font-weight-bold">เลือกลายการผลิต (Line):</label>
      <select id="lineSelect" class="form-select form-select-lg" onchange="onLineChange()">
        <option value="" disabled selected>-- เลือก Line --</option>
        <option value="LINE B">LINE B</option>
        <option value="LINE C">LINE C</option>
        <option value="LINE D">LINE D</option>
        <option value="LINE E">LINE E</option>
        <option value="LINE F">LINE F</option>
        <option value="LINE G">LINE G</option>
      </select>
    </div>

    <!-- ส่วนแสดงโปรไฟล์ผู้กรอก -->
    <div id="userInfo" class="alert alert-info py-2 text-center" style="display:none;">
      ผู้รายงาน: <strong id="userDisplayName">กำลังโหลด...</strong>
    </div>

    <!-- ตารางกรอกยอดรายชั่วโมง -->
    <div id="hourlyFormSection" style="display:none;">
      <table class="table table-bordered table-striped text-center align-middle">
        <thead class="table-dark">
          <tr>
            <th style="width: 45%;">ช่วงเวลา</th>
            <th style="width: 55%;">ยอดผลิต (ชิ้น)</th>
          </tr>
        </thead>
        <tbody id="hourlyTableBody">
          <!-- สร้างรายการโดย JavaScript -->
        </tbody>
      </table>

      <!-- หมายเหตุเพิ่มเติม -->
      <div class="mb-3">
        <label for="remarkInput" class="form-label">หมายเหตุ / ปัญหาที่พบ:</label>
        <textarea id="remarkInput" class="form-control" rows="2" placeholder="ระบุเหตุผลกรณีไม่ได้ตามเป้า..."></textarea>
      </div>

      <button class="btn btn-submit" onclick="submitData()">💾 บันทึกยอดผลิต</button>
    </div>

  </div>
</div>

<script>
  // *** ใส่ URL ของ Web App จาก Apps Script ของคุณที่นี่ ***
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx.../exec"; 

  const TIME_SLOTS = [
    "08.30-09.30", "09.30-10.30", "10.30-11.30", "11.30-12.30", 
    "12.30-13.30", "13.30-14.30", "14.30-15.30", "15.30-16.30", 
    "16.30-17.30", "17.30-18.30", "18.30-19.30"
  ];

  let currentProfile = null;

  // 1. ตรวจสอบเวลาพักตามเงื่อนไข Line
  function isBreakTimeSlot(lineCode, timeSlot) {
    if (!lineCode || !timeSlot) return false;
    const cleanLine = String(lineCode).replace(/LINE/i, '').replace(/\s+/g, '').toUpperCase();
    const slot = String(timeSlot).trim();

    // LINE B และ LINE C -> พัก 12.30-13.30
    if ((cleanLine === 'B' || cleanLine === 'C') && slot === '12.30-13.30') {
      return true;
    }
    // LINE D, E, F, G -> พัก 11.30-12.30
    if (['D', 'E', 'F', 'G'].includes(cleanLine) && slot === '11.30-12.30') {
      return true;
    }
    return false;
  }

  // Initial LIFF SDK
  window.onload = function() {
    liff.init({ liffId: "YOUR_LIFF_ID" }) // ใส่ LIFF ID ของคุณ
      .then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(profile => {
            currentProfile = profile;
            document.getElementById('userDisplayName').innerText = profile.displayName;
            document.getElementById('userInfo').style.display = 'block';
          });
        } else {
          liff.login();
        }
      })
      .catch(err => {
        console.error("LIFF Init Error: ", err);
        document.getElementById('userDisplayName').innerText = 'ทั่วไป (ไม่ผ่าน LINE)';
        document.getElementById('userInfo').style.display = 'block';
      });
  };

  // 2. เมื่อมีการเลือก Line ให้สร้างตารางกรอกยอด
  function onLineChange() {
    const selectedLine = document.getElementById('lineSelect').value;
    if (!selectedLine) return;

    fetchExistingData(selectedLine);
  }

  // ดึงข้อมูลเดิมของวันนี้มาแสดง (ถ้ามี)
  function fetchExistingData(line) {
    const tbody = document.getElementById('hourlyTableBody');
    tbody.innerHTML = '<tr><td colspan="2">กำลังโหลดข้อมูล...</td></tr>';
    document.getElementById('hourlyFormSection').style.display = 'block';

    fetch(`${WEB_APP_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`)
      .then(res => res.json())
      .then(data => {
        renderTable(line, data.existingHourly || {});
      })
      .catch(err => {
        console.error(err);
        renderTable(line, {});
      });
  }

  // 3. แสดงผลตารางและล็อกช่องพัก
  function renderTable(selectedLine, existingData) {
    const tbody = document.getElementById('hourlyTableBody');
    tbody.innerHTML = '';

    TIME_SLOTS.forEach(slot => {
      const isBreak = isBreakTimeSlot(selectedLine, slot);
      const existingVal = existingData[slot] ? existingData[slot].output : '';

      const tr = document.createElement('tr');
      if (isBreak) {
        tr.className = 'table-break';
        tr.innerHTML = `
          <td>${slot} (เวลาพัก)</td>
          <td><input type="number" class="form-control text-center" value="0" disabled style="background-color: #e9ecef; cursor: not-allowed;" /></td>
        `;
      } else {
        tr.innerHTML = `
          <td>${slot}</td>
          <td>
            <input type="number" 
                   class="form-control text-center hourly-input" 
                   data-slot="${slot}" 
                   value="${existingVal}" 
                   placeholder="0" 
                   min="0" />
          </td>
        `;
      }
      tbody.appendChild(tr);
    });
  }

  // 4. ส่งข้อมูลไปยัง Apps Script
  function submitData() {
    const selectedLine = document.getElementById('lineSelect').value;
    if (!selectedLine) {
      alert('กรุณาเลือกลายการผลิต');
      return;
    }

    const inputs = document.querySelectorAll('.hourly-input');
    const hourlyDetails = [];

    inputs.forEach(input => {
      const slot = input.getAttribute('data-slot');
      const val = input.value;
      if (val !== '' && !input.disabled) {
        hourlyDetails.push({
          timeSlot: slot,
          qty: Number(val) || 0
        });
      }
    });

    const displayName = currentProfile ? currentProfile.displayName : 'Unknown User';
    const remark = document.getElementById('remarkInput').value || '';

    const payload = {
      action: 'saveHourlyOutput',
      line: selectedLine,
      updatedBy: displayName,
      hourlyDetails: hourlyDetails,
      remark: remark
    };

    // ส่งข้อมูลไปเซฟ
    fetch(WEB_APP_URL, {
      method: 'POST',
      contentType: 'application/json',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'success') {
        alert('บันทึกยอดการผลิตสำเร็จเรียบร้อยแล้ว!');
        if (liff.isInClient()) {
          liff.closeWindow();
        } else {
          location.reload();
        }
      } else {
        alert('เกิดข้อผิดพลาด: ' + (res.error || 'ไม่สามารถบันทึกได้'));
      }
    })
    .catch(err => {
      alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
      console.error(err);
    });
  }
</script>

</body>
</html>
