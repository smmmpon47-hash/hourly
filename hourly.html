<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดรายชั่วโมง (Output/hr)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-200">
    <div class="text-center mb-6">
      <div class="inline-flex p-3 rounded-full bg-sky-100 text-sky-600 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-800">บันทึกยอดรายชั่วโมง</h1>
      <p class="text-sm text-slate-500">Output / Hour Report</p>
    </div>

    <form id="hourlyForm" class="space-y-4" onsubmit="event.preventDefault(); submitForm();">
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">เลือก Production Line</label>
        <select id="lineSelect" onchange="loadLineInfo()" class="w-full p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none" required>
          <option value="" disabled selected>-- เลือก Line การผลิต --</option>
          <option value="B">LINE B</option>
          <option value="C">LINE C</option>
          <option value="D">LINE D</option>
          <option value="E">LINE E</option>
          <option value="F">LINE F</option>
          <option value="G">LINE G</option>
        </select>
      </div>

      <div id="infoBox" class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">LOT No.:</span>
          <span id="dispLot" class="font-semibold text-slate-800">-</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">Model:</span>
          <span id="dispModel" class="font-semibold text-slate-800">-</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">เป้าหมายประจำชั่วโมง:</span>
          <span id="dispTargetHr" class="font-bold text-sky-600">- ชิ้น/ชั่วโมง</span>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">รอบเวลา (Time Slot)</label>
        <select id="timeSlot" class="w-full p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none" required>
          <option value="" disabled selected>-- เลือกรอบเวลา --</option>
          <option value="08:00 - 09:00">08:00 - 09:00</option>
          <option value="09:00 - 10:00">09:00 - 10:00</option>
          <option value="10:00 - 11:00">10:00 - 11:00</option>
          <option value="11:00 - 12:00">11:00 - 12:00</option>
          <option value="13:00 - 14:00">13:00 - 14:00</option>
          <option value="14:00 - 15:00">14:00 - 15:00</option>
          <option value="15:00 - 16:00">15:00 - 16:00</option>
          <option value="16:00 - 17:00">16:00 - 17:00</option>
          <option value="17:00 - 18:00">17:00 - 18:00 (OT)</option>
          <option value="18:00 - 19:00">18:00 - 19:00 (OT)</option>
          <option value="19:00 - 20:00">19:00 - 20:00 (OT)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">ยอดผลิตจริงประจำรอบนี้ (ชิ้น)</label>
        <input type="number" id="outputActual" placeholder="กรอกจำนวนชิ้นงาน" min="0" required class="w-full p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">หมายเหตุ / ปัญหาที่พบ (ถ้ามี)</label>
        <textarea id="note" rows="2" placeholder="เช่น เครื่องจักรขัดข้อง 10 นาที" class="w-full p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-lg shadow-md transition duration-200 mt-2">
        ⏱️ บันทึกยอดรายชั่วโมง
      </button>

    </form>
  </div>

  <script>
    const LIFF_ID = '2011198724-JQ60DTBm';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec';

    let userDisplayName = 'Unknown';

    window.onload = function () {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              userDisplayName = profile.displayName;
            });
          }
        })
        .catch(err => console.error('LIFF Init Error:', err));
    };

    function loadLineInfo() {
      const line = document.getElementById('lineSelect').value;
      if (!line) return;

      Swal.showLoading();
      fetch(`${WEB_APP_URL}?action=getHourlyInfo&line=${line}`)
        .then(res => res.json())
        .then(data => {
          Swal.close();
          if (data.error) {
            Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: data.error });
            document.getElementById('infoBox').classList.add('hidden');
          } else {
            document.getElementById('dispLot').innerText = data.lotNumber;
            document.getElementById('dispModel').innerText = data.model;
            document.getElementById('dispTargetHr').innerText = `${data.targetPerHour} ชิ้น/ชั่วโมง`;
            document.getElementById('infoBox').classList.remove('hidden');
          }
        })
        .catch(err => {
          Swal.close();
          console.error(err);
        });
    }

    function submitForm() {
      const line = document.getElementById('lineSelect').value;
      const timeSlot = document.getElementById('timeSlot').value;
      const outputActual = document.getElementById('outputActual').value;
      const note = document.getElementById('note').value;

      if (!line || !timeSlot || !outputActual) {
        Swal.fire({ icon: 'warning', title: 'กรอกข้อมูลไม่ครบ', text: 'กรุณากรอกข้อมูลให้ครบถ้วน' });
        return;
      }

      const payload = {
        action: 'saveHourlyOutput',
        line: line,
        timeSlot: timeSlot,
        outputActual: Number(outputActual),
        note: note,
        updatedBy: userDisplayName
      };

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึกข้อมูล...';

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.innerText = '⏱️ บันทึกยอดรายชั่วโมง';

        if (data.status === 'duplicate') {
          Swal.fire({ icon: 'warning', title: 'ไม่สามารถบันทึกได้', text: data.message, confirmButtonColor: '#0284C7' });
        } else if (data.status === 'success') {
          Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', text: 'บันทึกยอดรายชั่วโมงเรียบร้อยแล้ว', timer: 2000 }).then(() => {
            if (liff.isInClient()) liff.closeWindow();
          });
        } else {
          Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: data.error || 'ไม่สามารถบันทึกข้อมูลได้' });
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = '⏱️ บันทึกยอดรายชั่วโมง';
        Swal.fire({ icon: 'error', title: 'Error', text: err.message });
      });
    }
  </script>
</body>
</html>
