<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwziSYLaDcymEHVXQr_qOP6RmIQDjixVPqWwhAQSOMXs_4zAA-gscpeuR7fJp7DY6yp/exec"; 
  let lineProfile = null;
  let activeModels = []; // เก็บรายชื่อ Model สำหรับ Dropdown
  let masterLotMap = {}; // Map คู่มือ (LOT_Number -> Model)
  let addedMiddayLots = []; // [เพิ่มใหม่] ตัวแปรจำ LOT ใหม่ที่สลับเพิ่มระหว่างวัน

  const TIME_SLOTS_DEF = [
    { label: "08.30-09.30", endMin: 570 },
    { label: "09.30-10.30", endMin: 630 },
    { label: "10.30-11.30", endMin: 690 },
    { label: "11.30-12.30", endMin: 750 },
    { label: "12.30-13.30", endMin: 810 },
    { label: "13.30-14.30", endMin: 870 },
    { label: "14.30-15.30", endMin: 930 },
    { label: "15.30-16.30", endMin: 990 },
    { label: "16.30-17.30", endMin: 1050 },
    { label: "17.30-18.30", endMin: 1110 },
    { label: "18.30-19.30", endMin: 1170 }
  ];

  // 1. เชื่อมต่อ LIFF ดึงโปรไฟล์ LINE
  async function initLiff() {
    try {
      await liff.init({ liffId: "2011196323-6e8Sc2U8" });
      if (liff.isLoggedIn()) { 
        lineProfile = await liff.getProfile(); 
      } else { 
        liff.login(); 
      }
    } catch (err) { 
      console.error("LIFF Init Error:", err); 
    }
  }
  initLiff();

  function displayCurrentDate() {
    const now = new Date();
    document.getElementById('currentDateDisplay').innerText = now.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  displayCurrentDate();

  async function loadLineDetails() {
    const line = document.getElementById('line').value;
    const slotsContainer = document.getElementById('slotsContainer');
    const infoBanner = document.getElementById('infoBanner');
    const btnAddMiddayLot = document.getElementById('btnAddMiddayLot');

    if (!line) {
      slotsContainer.innerHTML = '<p style="color: #94a3b8; font-size: 0.95rem; text-align: center; padding: 15px 0;">โปรดเลือก LINE การผลิต</p>';
      infoBanner.style.display = 'none';
      btnAddMiddayLot.style.display = 'none';
      return;
    }

    slotsContainer.innerHTML = '<p style="color: #64748b; font-size: 0.95rem; text-align: center; padding: 15px 0;">กำลังโหลดข้อมูล...</p>';

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      activeModels = data.models || [];
      masterLotMap = data.masterMap || {}; 
      const totalHours = Number(data.totalWorkingHours) || 8;
      const targetVal = Number(data.target) || 0;

      if (data.reported) {
        document.getElementById('targetVal').innerText = targetVal.toLocaleString();
        document.getElementById('hoursVal').innerText = totalHours;
        infoBanner.style.display = 'flex';
      } else {
        infoBanner.style.display = 'none';
      }

      btnAddMiddayLot.style.display = 'block';
      generateSmartTimeSlots(totalHours);

    } catch (err) {
      console.error("Error loading line details:", err);
      btnAddMiddayLot.style.display = 'block';
      generateSmartTimeSlots(8);
    }
  }

  function generateSmartTimeSlots(totalHours) {
    const slotsContainer = document.getElementById('slotsContainer');
    slotsContainer.innerHTML = '';

    const now = new Date();
    const currentMinutes = (now.getHours() * 60) + now.getMinutes();

    let passedSlots = TIME_SLOTS_DEF.filter(slot => currentMinutes >= slot.endMin);
    const maxCount = Math.min(Math.ceil(totalHours), TIME_SLOTS_DEF.length);
    passedSlots = passedSlots.slice(0, maxCount);

    let targetSlots = [];
    if (passedSlots.length > 0) {
      targetSlots = passedSlots.slice(-2);
    } else if (maxCount > 0) {
      targetSlots = [TIME_SLOTS_DEF[0]];
    }

    let modelOptionsHTML = activeModels.length > 0 
      ? activeModels.map(m => `<option value="${m}">${m}</option>`).join('') 
      : '<option value="">-- ไม่พบ Model --</option>';

    targetSlots.forEach(slot => {
      const row = document.createElement('div');
      row.className = 'slot-row';
      row.innerHTML = `
        <div class="slot-time" data-time="${slot.label}">${slot.label}</div>
        <select class="slot-lot-select input-lot-val">
          ${modelOptionsHTML}
        </select>
        <input type="number" class="slot-input input-val" min="0" placeholder="0" oninput="calculateTotal()">
      `;
      slotsContainer.appendChild(row);
    });

    calculateTotal();
  }

  // 2. ฟังก์ชันปุ่มกรอก LOT เพิ่มเติม (จำเลข LOT ไว้ส่งหลังบ้านด้วย)
  function promptNewLotNumber() {
    const inputLot = prompt("กรุณากรอก 'เลข LOT Number' ที่ต้องการสลับผลิต:");
    if (inputLot && inputLot.trim() !== "") {
      const formattedLot = inputLot.trim().toUpperCase();
      const targetModel = masterLotMap[formattedLot] || formattedLot;

      // [เพิ่มใหม่] เก็บเลข LOT ลง Array ไว้ส่งให้ Apps Script
      if (!addedMiddayLots.includes(formattedLot)) {
        addedMiddayLots.push(formattedLot);
      }

      if (!activeModels.includes(targetModel)) {
        activeModels.push(targetModel);
        
        const selects = document.querySelectorAll('.input-lot-val');
        selects.forEach(select => {
          const opt = document.createElement('option');
          opt.value = targetModel;
          opt.innerText = targetModel;
          opt.selected = true; 
          select.appendChild(opt);
        });
      }
    }
  }

  function calculateTotal() {
    const inputs = document.querySelectorAll('.input-val');
    let total = 0;
    inputs.forEach(input => {
      total += (Number(input.value) || 0);
    });
    document.getElementById('totalSum').value = total.toLocaleString();
  }

  // 3. [เพิ่มใหม่] ฟังก์ชันกดปุ่ม "บันทึกยอด" ยิงข้อมูลออก
  document.getElementById('hourlyForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const rows = document.querySelectorAll('.slot-row');
    const hourlyData = [];

    rows.forEach(row => {
      const timeSlot = row.querySelector('.slot-time').getAttribute('data-time');
      const selectedModel = row.querySelector('.input-lot-val').value;
      const qty = Number(row.querySelector('.input-val').value) || 0;

      if (timeSlot && selectedModel) {
        hourlyData.push({ timeSlot, model: selectedModel, qty });
      }
    });

    const payload = {
      formType: "HOURLY_OUTPUT",
      line: document.getElementById('line').value,
      remark: document.getElementById('remark').value || "",
      updatedBy: lineProfile ? lineProfile.displayName : "Unknown",
      hourlyData: hourlyData,
      newAddedLots: addedMiddayLots // แนบรายการ LOT ใหม่ยิงกลับไปบันทึกที่ Summary
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === 'success') {
        alert("บันทึกยอดการผลิตเรียบร้อยแล้ว!");
        if (typeof liff !== 'undefined' && liff.isInClient()) {
          liff.closeWindow();
        }
      } else {
        alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      console.error(err);
    }
  });
</script>
