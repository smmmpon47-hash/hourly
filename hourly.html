<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดการผลิตรายชั่วโมง</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .header-box { text-align: center; margin-bottom: 20px; }
    .header-box h2 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(45deg, #00b0ff, #06c755);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-box p { color: #666; font-size: 0.82rem; margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #2c3e50; font-size: 0.88rem; }
    
    select, input, textarea {
      width: 100%;
      padding: 11px 13px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      background: #f8fafc;
      color: #1e293b;
      outline: none;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #00b0ff;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 176, 255, 0.15);
    }

    .info-box {
      background: linear-gradient(135deg, #e0f2fe, #bae6fd);
      border: 1px solid #7dd3fc;
      color: #0369a1;
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
    }

    .slot-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: all 0.2s;
    }
    .slot-row:hover { border-color: #38bdf8; }
    .slot-time { flex: 2; font-weight: 600; color: #334155; font-size: 0.8rem; }
    .slot-lot { flex: 2.2; }
    .slot-input { flex: 1.8; }
    .slot-input input { padding: 8px; text-align: center; font-weight: 600; }

    .btn-group { display: flex; gap: 12px; margin-top: 24px; }
    .btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-submit {
      background: linear-gradient(135deg, #00b0ff, #0081cb);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 176, 255, 0.3);
    }
    .btn-submit:active { transform: scale(0.97); }
    .btn-cancel { background: #f1f5f9; color: #64748b; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-box">
    <h2>บันทึกยอดการผลิต</h2>
    <p>Hourly Production Output Record</p>
  </div>

  <form id="hourlyForm">
    <div class="form-group">
      <label for="line">LINE การผลิต</label>
      <select id="line" required onchange="loadLineDetails()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <div id="lineSummaryInfo" class="info-box" style="display: none;">
      <span>🎯 เป้าหมาย: <strong id="infoTarget">0</strong></span>
      <span>⏱️ รวม: <strong id="infoHours">0</strong> ชม.</span>
    </div>

    <div class="form-group">
      <label>กรอกยอดผลิตรายชั่วโมง</label>
      <div id="slotsContainer">
        <p style="color: #94a3b8; font-size: 0.85rem; text-align: center; padding: 20px 0;">โปรดเลือก Line เพื่อดึงรายการชั่วโมง</p>
      </div>
    </div>

    <div class="form-group">
      <label for="remark">หมายเหตุ / Note (ถ้ามี)</label>
      <textarea id="remark" rows="2" placeholder="เช่น เครื่องจักรขัดข้อง, วัตถุดิบขาดแคลน"></textarea>
    </div>

    <div class="btn-group">
      <button type="button" class="btn btn-cancel" onclick="liff.closeWindow()">ยกเลิก</button>
      <button type="submit" class="btn btn-submit">บันทึกยอด</button>
    </div>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec";
  let lineProfile = null;
  let activeLots = [];

  const DEFAULT_TIME_SLOTS = [
    "08:30 - 09:30", "09:30 - 10:30", "10:30 - 11:30", "11:30 - 12:30",
    "12:30 - 13:30", "13:30 - 14:30", "14:30 - 15:30", "15:30 - 16:30",
    "16:30 - 17:30", "17:30 - 18:30 (OT)", "18:30 - 19:30 (OT)"
  ];

  async function initLiff() {
    try {
      await liff.init({ liffId: "2011198724-JQ60DTBm" });
      if (liff.isLoggedIn()) {
        lineProfile = await liff.getProfile();
      } else {
        liff.login();
      }
    } catch (err) { console.error("LIFF Init Error:", err); }
  }
  initLiff();

  async function loadLineDetails() {
    const line = document.getElementById('line').value;
    const slotsContainer = document.getElementById('slotsContainer');
    const infoBox = document.getElementById('lineSummaryInfo');

    if (!line) {
      slotsContainer.innerHTML = '<p style="color: #94a3b8; font-size: 0.85rem; text-align: center; padding: 20px 0;">โปรดเลือก Line เพื่อดึงรายการชั่วโมง</p>';
      infoBox.style.display = 'none';
      return;
    }

    slotsContainer.innerHTML = '<p style="color: #64748b; font-size: 0.85rem; text-align: center; padding: 20px 0;">กำลังโหลดข้อมูล...</p>';

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      activeLots = data.lots || [];
      const totalHours = data.totalWorkingHours || 8;

      document.getElementById('infoTarget').innerText = data.target || 0;
      document.getElementById('infoHours').innerText = totalHours;
      infoBox.style.display = 'flex';

      generateTimeSlots(totalHours);

    } catch (err) {
      console.error("Error loading line details:", err);
      slotsContainer.innerHTML = '<p style="color: #ef4444; font-size: 0.85rem; text-align: center;">โหลดข้อมูลไม่สำเร็จ</p>';
    }
  }

  function generateTimeSlots(totalHours) {
    const slotsContainer = document.getElementById('slotsContainer');
    slotsContainer.innerHTML = '';

    const count = Math.min(Math.ceil(totalHours), DEFAULT_TIME_SLOTS.length);

    if (count === 0) {
      slotsContainer.innerHTML = '<p style="color: #ef4444; font-size: 0.85rem; text-align: center; padding: 15px 0;">ยังไม่ได้บันทึกเป้าประจำวัน (TG)</p>';
      return;
    }

    for (let i = 0; i < count; i++) {
      const timeLabel = DEFAULT_TIME_SLOTS[i] || `ชั่วโมงที่ ${i + 1}`;
      let lotOptionsHTML = activeLots.length > 0 ? activeLots.map(lot => `<option value="${lot}">${lot}</option>`).join('') : '<option value="">-</option>';

      const row = document.createElement('div');
      row.className = 'slot-row';
      row.innerHTML = `
        <div class="slot-time">${timeLabel}</div>
        <div class="slot-lot">
          <select class="input-slot-lot">${lotOptionsHTML}</select>
        </div>
        <div class="slot-input">
          <input type="number" class="input-slot-val" placeholder="0" min="0">
        </div>
      `;
      slotsContainer.appendChild(row);
    }
  }

  document.getElementById('hourlyForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const line = document.getElementById('line').value;
    const remark = document.getElementById('remark').value;
    const slotRows = document.querySelectorAll('.slot-row');
    const hourlyDetails = [];

    slotRows.forEach(row => {
      const timeLabel = row.querySelector('.slot-time').innerText;
      const lot = row.querySelector('.input-slot-lot').value;
      const outputVal = row.querySelector('.input-slot-val').value;

      if (outputVal !== "" && outputVal !== null) {
        hourlyDetails.push({
          timeLabel: timeLabel,
          lot: lot,
          output: Number(outputVal)
        });
      }
    });

    if (hourlyDetails.length === 0) {
      alert("กรุณากรอกยอดผลิตอย่างน้อย 1 ช่องเวลา");
      return;
    }

    const payload = {
      formType: "OUTPUT_FORM",
      line: line,
      remark: remark,
      hourlyDetails: hourlyDetails,
      updatedBy: lineProfile ? lineProfile.displayName : "Unknown"
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === 'success') {
        alert("บันทึกยอดการผลิตสำเร็จ!");
        liff.closeWindow();
      } else {
        alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      console.error(err);
    }
  });
</script>

</body>
</html>
