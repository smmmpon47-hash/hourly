<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดผลิตรายชั่วโมง</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <h2 class="text-xl font-bold text-center text-blue-600 mb-4">⏰ บันทึกยอดผลิตรายชั่วโมง</h2>
    
    <div id="loading" class="text-center py-8">
      <p class="text-gray-500">กำลังโหลดข้อมูล...</p>
    </div>

    <form id="hourlyForm" class="hidden space-y-4">
      <!-- เลือก LINE -->
      <div>
        <label class="block text-sm font-medium text-gray-700">เลือก Production Line</label>
        <select id="lineSelect" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required onchange="loadLineData()">
          <option value="">-- เลือก Line --</option>
          <option value="LINE B">LINE B</option>
          <option value="LINE C">LINE C</option>
          <option value="LINE D">LINE D</option>
          <option value="LINE E">LINE E</option>
          <option value="LINE F">LINE F</option>
          <option value="LINE G">LINE G</option>
        </select>
      </div>

      <!-- ข้อมูลเป้าหมาย -->
      <div id="targetInfo" class="hidden bg-blue-50 p-3 rounded-lg text-sm text-blue-800 space-y-1">
        <p><strong>เป้าหมายรวม:</strong> <span id="targetValue">0</span> ชิ้น</p>
        <p><strong>ชั่วโมงทำงาน:</strong> <span id="hoursValue">0</span> ชม.</p>
      </div>

      <!-- รายการลงยอดรายชั่วโมง -->
      <div id="hourlyInputs" class="space-y-3 pt-2">
        <!-- JS จะสร้างช่องกรอกให้อัตโนมัติ -->
      </div>

      <!-- หมายเหตุ -->
      <div>
        <label class="block text-sm font-medium text-gray-700">หมายเหตุ / ปัญหาที่พบ</label>
        <textarea id="remark" rows="2" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="ระบุเหตุผลหากยอดตกเป้า..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition">
        บันทึกยอดผลิต
      </button>
    </form>
  </div>

  <script>
    // ⚠️ ใส่ URL ของ Google Apps Script Web App ของคุณที่นี่
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwziSYLaDcymEHVXQr_qOP6RmIQDjixVPqWwhAQSOMXs_4zAA-gscpeuR7fJp7DY6yp/exec"; 
    const LIFF_ID = "2011198724-JQ60DTBm";

    const TIME_SLOTS = [
      "08.30-09.30", "09.30-10.30", "10.30-11.30", "11.30-12.30", "12.30-13.30",
      "13.30-14.30", "14.30-15.30", "15.30-16.30", "16.30-17.30", "17.30-18.30", "18.30-19.30"
    ];

    let userDisplayName = "Unknown";
    let availableModels = [];

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userDisplayName = profile.displayName;
        } else {
          liff.login();
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
      } finally {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("hourlyForm").classList.remove("hidden");
      }
    }

    async function loadLineData() {
      const line = document.getElementById("lineSelect").value;
      if (!line) return;

      const targetInfo = document.getElementById("targetInfo");
      const inputsDiv = document.getElementById("hourlyInputs");
      inputsDiv.innerHTML = "<p class='text-sm text-gray-500 text-center'>กำลังดึงข้อมูล Line...</p>";

      try {
        const res = await fetch(`${GAS_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
        const data = await res.json();

        document.getElementById("targetValue").innerText = data.target || 0;
        document.getElementById("hoursValue").innerText = data.totalWorkingHours || 8;
        targetInfo.classList.remove("hidden");

        availableModels = data.models && data.models.length > 0 ? data.models : ["General Lot"];
        renderHourlyInputs(data.existingHourly || {});
      } catch (err) {
        alert("ดึงข้อมูลไม่สำเร็จ: " + err.message);
      }
    }

    function renderHourlyInputs(existingData) {
      const inputsDiv = document.getElementById("hourlyInputs");
      inputsDiv.innerHTML = "";

      TIME_SLOTS.forEach(slot => {
        const existing = existingData[slot] || {};
        const lotOptions = availableModels.map(m => 
          `<option value="${m}" ${existing.lot === m ? 'selected' : ''}>${m}</option>`
        ).join('');

        const row = document.createElement("div");
        row.className = "p-2 border rounded bg-gray-50 flex flex-col space-y-1";
        row.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-gray-600">${slot}</span>
            <input type="number" data-slot="${slot}" class="qty-input w-24 p-1 border rounded text-right" placeholder="ยอดชิ้น" value="${existing.output || ''}">
          </div>
          <select data-slot-lot="${slot}" class="lot-select text-xs p-1 border rounded bg-white">
            ${lotOptions}
          </select>
        `;
        inputsDiv.appendChild(row);
      });
    }

    document.getElementById("hourlyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const line = document.getElementById("lineSelect").value;
      const remark = document.getElementById("remark").value;
      const btn = document.getElementById("submitBtn");

      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      const hourlyData = [];
      const newAddedLots = [];

      document.querySelectorAll(".qty-input").forEach(input => {
        const qty = input.value;
        if (qty !== "") {
          const timeSlot = input.getAttribute("data-slot");
          const modelSelect = document.querySelector(`select[data-slot-lot="${timeSlot}"]`);
          const model = modelSelect ? modelSelect.value : "";

          hourlyData.push({
            timeSlot: timeSlot,
            qty: Number(qty),
            model: model
          });

          if (model && !newAddedLots.includes(model)) {
            newAddedLots.push(model);
          }
        }
      });

      const payload = {
        formType: "HOURLY_OUTPUT",
        action: "saveHourlyOutput",
        line: line,
        remark: remark,
        updatedBy: userDisplayName,
        hourlyData: hourlyData,
        newAddedLots: newAddedLots
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === "success") {
          alert("บันทึกยอดสำเร็จเรียบร้อย!");
          if (liff.isInClient()) liff.closeWindow();
        } else {
          alert("เกิดข้อผิดพลาด: " + (result.error || "บันทึกไม่สำเร็จ"));
        }
      } catch (err) {
        alert("ส่งข้อมูลไม่สำเร็จ: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "บันทึกยอดผลิต";
      }
    });

    main();
  </script>
</body>
</html>
