<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งเป้าการผลิตประจำวัน (Form TG)</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
    body {
      background-color: #1e3a3f;
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .card {
      background: #ffffff;
      padding: 24px 22px;
      border-radius: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0d9488;
      margin: 0 0 18px 0;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b; font-size: 0.95rem; }
    
    select, input {
      width: 100%;
      padding: 11px 14px;
      border: 1.8px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.05rem;
      outline: none;
      background: #fff;
      color: #0f172a;
    }
    select:focus, input:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.2);
    }

    .lot-card {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .lot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .badge-rate {
      font-size: 0.85rem;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 10px;
      font-weight: 600;
    }

    .row-2col {
      display: flex;
      gap: 12px;
    }
    .row-2col .form-group { flex: 1; margin-bottom: 8px; }

    .model-subtext {
      font-size: 0.8rem;
      color: #0d9488;
      font-weight: 600;
      margin-top: 4px;
      min-height: 18px;
    }

    /* ปุ่มกดเลือก เวลาทำงาน */
    .hours-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-hour-chip {
      flex: 1;
      padding: 12px 0;
      background: #fff;
      border: 1.8px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-hour-chip.active {
      background: #0d9488;
      color: #ffffff;
      border-color: #0d9488;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
    }

    .summary-box {
      background: #0d9488;
      color: white;
      border-radius: 18px;
      padding: 14px 18px;
      margin: 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-title { font-size: 0.9rem; opacity: 0.95; font-weight: 500; }
    .summary-subtitle { font-size: 0.75rem; opacity: 0.8; }
    .summary-value { font-size: 1.5rem; font-weight: 700; }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
      margin-top: 6px;
    }
    .btn-submit:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
  

    /* ===== MOBILE / LIFF READABILITY FIX ===== */
    html, body{
      max-width:100%;
      overflow-x:hidden;
    }

    body{
      padding:14px 10px;
      font-size:16px;
    }

    .card{
      width:100%;
      max-width:460px;
      padding:20px 16px;
      border-radius:20px;
      overflow:hidden;
    }

    .header-title{
      font-size:1.35rem;
      line-height:1.25;
      margin-bottom:16px;
      gap:6px;
      flex-wrap:wrap;
    }

    .form-group{
      min-width:0;
      margin-bottom:15px;
    }

    label{
      font-size:.95rem;
      line-height:1.35;
    }

    select, input{
      min-width:0;
      width:100%;
      font-size:1rem;
      padding:11px 12px;
    }

    .lot-card{
      padding:14px 13px;
      border-radius:16px;
      margin-bottom:15px;
      overflow:hidden;
    }

    .lot-header{
      gap:8px;
      font-size:.95rem;
      line-height:1.25;
      flex-wrap:wrap;
      align-items:flex-start;
    }

    .badge-rate{
      font-size:.75rem;
      padding:4px 8px;
      white-space:nowrap;
      flex-shrink:0;
    }

    .model-subtext{
      font-size:.75rem;
      line-height:1.35;
      overflow-wrap:anywhere;
    }

    /* แถว 2 ช่องไม่ให้ล้นขอบ */
    .row-2col{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:9px;
      width:100%;
    }

    .row-2col .form-group{
      min-width:0;
      width:100%;
      margin-bottom:8px;
    }

    .hours-btn-group{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      width:100%;
    }

    .btn-hour-chip{
      min-width:0;
      width:100%;
      padding:11px 4px;
      font-size:.95rem;
      line-height:1.2;
      white-space:nowrap;
    }

    .summary-box{
      gap:10px;
      padding:13px 14px;
      border-radius:16px;
      margin:16px 0;
      min-width:0;
    }

    .summary-box > div:first-child{
      min-width:0;
    }

    .summary-title{
      font-size:.86rem;
      line-height:1.3;
    }

    .summary-subtitle{
      font-size:.70rem;
      line-height:1.35;
      margin-top:2px;
    }

    .summary-value{
      font-size:1.28rem;
      line-height:1.1;
      white-space:nowrap;
      flex-shrink:0;
    }

    .btn-submit{
      font-size:1rem;
      padding:13px 10px;
      border-radius:14px;
    }

    @media (max-width:390px){
      body{
        padding:10px 6px;
      }

      .card{
        padding:16px 12px;
        border-radius:18px;
      }

      .header-title{
        font-size:1.22rem;
      }

      .lot-card{
        padding:12px 10px;
      }

      .lot-header{
        font-size:.9rem;
      }

      .badge-rate{
        font-size:.7rem;
        padding:4px 7px;
      }

      .row-2col{
        grid-template-columns:1fr;
        gap:2px;
      }

      .hours-btn-group{
        gap:6px;
      }

      .btn-hour-chip{
        font-size:.86rem;
        padding:10px 2px;
      }

      .summary-box{
        padding:11px 10px;
        gap:7px;
      }

      .summary-title{
        font-size:.8rem;
      }

      .summary-subtitle{
        font-size:.66rem;
      }

      .summary-value{
        font-size:1.15rem;
      }
    }

  

    /* =========================================================
       FORM UX POLISH — MORE BREATHING ROOM + LARGER TYPE
       ปรับเฉพาะหน้าตา ไม่แตะ logic เดิม
       ========================================================= */
    body {
      padding: 28px 18px;
      font-size: 17px;
    }

    .card {
      max-width: 500px;
      padding: 30px 28px;
      border-radius: 24px;
    }

    .header-title {
      font-size: 1.65rem;
      line-height: 1.3;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      font-size: 1.04rem;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    select, input {
      min-height: 52px;
      padding: 13px 15px;
      font-size: 1.08rem;
      border-radius: 14px;
    }

    .lot-card {
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .lot-header {
      font-size: 1.08rem;
      line-height: 1.35;
      margin-bottom: 15px;
    }

    .badge-rate {
      font-size: .90rem;
      padding: 5px 11px;
    }

    .model-subtext {
      font-size: .85rem;
      line-height: 1.4;
      margin-top: 6px;
    }

    /* ถ้าช่องชั่วโมง LOT 1 ถูกซ่อน ให้ช่องเป้าหมายกินเต็มแถว */
    #lot1HoursContainer[style*="display: none"] + .form-group {
      grid-column: 1 / -1;
    }

    .hours-btn-group {
      gap: 10px;
      margin-top: 8px;
    }

    .btn-hour-chip {
      min-height: 50px;
      padding: 12px 6px;
      font-size: 1.06rem;
      border-radius: 14px;
    }

    /* เว้นกรอบสรุปเป้าจากริมการ์ด ไม่ให้ดูอึดอัด */
    .summary-box {
      margin: 22px 6px 20px;
      padding: 17px 22px;
      border-radius: 18px;
      gap: 16px;
    }

    .summary-title {
      font-size: 1rem;
      line-height: 1.35;
      font-weight: 700;
    }

    .summary-subtitle {
      font-size: .80rem;
      line-height: 1.4;
      margin-top: 2px;
    }

    .summary-value {
      font-size: 1.65rem;
      line-height: 1.1;
    }

    .btn-submit {
      min-height: 56px;
      padding: 15px 12px;
      font-size: 1.16rem;
      border-radius: 16px;
      margin-top: 8px;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px 9px;
        font-size: 16.5px;
      }

      .card {
        max-width: 460px;
        padding: 22px 18px;
        border-radius: 20px;
      }

      .header-title {
        font-size: 1.48rem;
        margin-bottom: 19px;
      }

      label { font-size: 1rem; }

      select, input {
        min-height: 50px;
        font-size: 1.04rem;
        padding: 12px 13px;
      }

      .lot-card {
        padding: 16px 15px;
        margin-bottom: 18px;
      }

      .lot-header { font-size: 1.02rem; }
      .badge-rate { font-size: .82rem; }
      .btn-hour-chip { font-size: 1rem; }

      .summary-box {
        margin: 19px 3px 18px;
        padding: 15px 17px;
        gap: 12px;
      }

      .summary-title { font-size: .96rem; }
      .summary-subtitle { font-size: .76rem; }
      .summary-value { font-size: 1.48rem; }
      .btn-submit { font-size: 1.10rem; }
    }

    @media (max-width: 390px) {
      body { padding: 10px 6px; }

      .card {
        padding: 18px 14px;
        border-radius: 18px;
      }

      .header-title { font-size: 1.34rem; }
      label { font-size: .98rem; }
      .lot-card { padding: 14px 12px; }
      .lot-header { font-size: .98rem; }
      .badge-rate { font-size: .76rem; }
      .btn-hour-chip { font-size: .94rem; }

      .summary-box {
        margin: 17px 2px 16px;
        padding: 14px 14px;
        gap: 10px;
      }

      .summary-title { font-size: .91rem; }
      .summary-subtitle { font-size: .72rem; }
      .summary-value { font-size: 1.32rem; }
    }

  </style>
</head>
<body>

<div class="card">
  <h2 class="header-title">🎯 ตั้งเป้าการผลิตประจำวัน</h2>

  <form id="tgForm">
    <!-- เลือกลายการผลิต B - G -->
    <div class="form-group">
      <label for="lineSelect">LINE การผลิต</label>
      <select id="lineSelect" required onchange="onLineSelected()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G ทดสอบ</option> 
      </select>
    </div>

    <!-- จำนวนคนตอนเช้า -->
    <div class="form-group">
      <label for="manpower">จำนวนคนในไลน์ (คน)</label>
      <input type="number" id="manpower" min="0" step="0.5" inputmode="decimal" placeholder="0 หรือ 0.5" required>
    </div>

    <!-- LOT 1 Card -->
    <div class="lot-card" id="cardLot1">
      <div class="lot-header">
        <span>📦 LOT ที่ 1</span>
        <span class="badge-rate" id="rateLot1Display">Rate: 0 ชิ้น/ชม.</span>
      </div>
      
      <div class="form-group">
        <label for="lot1No">เลข LOT Number</label>
        <input type="text" id="lot1No" placeholder="กรอกเลข LOT" required oninput="onLotInput(1)">
        <div class="model-subtext" id="modelSubtext1"></div>
      </div>

      <div class="row-2col">
        <div class="form-group" id="lot1HoursContainer" style="display: none;">
          <label for="lot1HoursSelect">ชั่วโมงผลิตจริง</label>
          <select id="lot1HoursSelect" onchange="onLot1HoursChange()">
            <!-- JS จะสเกลตัวเลือกตามเวลารวม -->
          </select>
        </div>
        <div class="form-group">
          <label for="lot1Target">เป้าหมาย (ชิ้น)</label>
          <input type="number" id="lot1Target" min="0" placeholder="0" required oninput="calculateRate()">
        </div>
      </div>
    </div>

    <!-- ปุ่มเลือก เวลาทำงานรวม -->
    <div class="form-group">
      <label>เวลาทำงานรวม</label>
      <div class="hours-btn-group">
        <button type="button" class="btn-hour-chip" onclick="selectTotalHours(8)">8 ชม.</button>
        <button type="button" class="btn-hour-chip active" onclick="selectTotalHours(9)">9 ชม.</button>
        <button type="button" class="btn-hour-chip" onclick="selectTotalHours(10)">10 ชม.</button>
      </div>
      <input type="hidden" id="selectedTotalHours" value="9">
    </div>

    <!-- สรุปเป้ารวม -->
    <div class="summary-box">
      <div>
        <div class="summary-title">เป้าหมายรวมทั้งวัน</div>
        <div class="summary-subtitle">(คำนวณตามสัดส่วนชั่วโมงจริง)</div>
      </div>
      <div class="summary-value"><span id="totalTargetDisplay">0</span> ชิ้น</div>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">บันทึกเป้าหมาย</button>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLm1LVkTiwK3PCvPSt3PFA1ifb76KCRsWxC1SkaLdDC-ginxy0RHWstWpHgDytaBmm/exec";
  const LIFF_ID = "2011196323-6e8Sc2U8";

  let masterLotMap = {};
  let userDisplayName = "Unknown";
  let initialTarget1 = 0;

  async function initLiff() {
    try {
      if (typeof liff !== "undefined" && LIFF_ID) {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userDisplayName = profile.displayName;
        }
      }
    } catch (err) {
      console.error("LIFF Init Error:", err);
    }
  }

  initLiff();

  function selectTotalHours(hrs) {
    document.getElementById('selectedTotalHours').value = hrs;
    const buttons = document.querySelectorAll('.btn-hour-chip');
    buttons.forEach(btn => {
      if (btn.innerText.includes(hrs)) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    updateLot1HoursDropdown(hrs);
    calculateRate();
  }

  function updateLot1HoursDropdown(totalHrs) {
    const select = document.getElementById('lot1HoursSelect');
    select.innerHTML = `<option value="${totalHrs}">${totalHrs} ชม. (เต็มวัน)</option>`;
    for (let i = 1; i < totalHrs; i++) {
      select.innerHTML += `<option value="${i}">${i} ชม.</option>`;
    }
  }

  async function onLineSelected() {
    const line = document.getElementById('lineSelect').value;
    const manpowerInput = document.getElementById('manpower');
    manpowerInput.value = '';
    if (!line) return;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();
      masterLotMap = data.masterMap || {};

      document.getElementById('manpower').value =
        (data.manpower === null || data.manpower === undefined) ? '' : data.manpower;

      if (data.lotNumber) {
        document.getElementById('lot1No').value = data.lotNumber;
        document.getElementById('lot1Target').value = data.target1 || data.target || 0;
        initialTarget1 = Number(data.target1 || data.target) || 0;
        
        if (data.totalWorkingHours) {
          selectTotalHours(Number(data.totalWorkingHours));
        }
        onLotInput(1);
      }
    } catch (err) {
      console.error("Error loading line data:", err);
    }
  }

  function onLotInput(index) {
    const lotVal = document.getElementById(`lot${index}No`).value.trim().toUpperCase();
    const subtextElem = document.getElementById(`modelSubtext${index}`);
    if (lotVal && masterLotMap[lotVal]) {
      subtextElem.innerText = `(รุ่น: ${masterLotMap[lotVal]})`;
    } else {
      subtextElem.innerText = '';
    }
  }

  function calculateRate() {
    const totalHrs = Number(document.getElementById('selectedTotalHours').value) || 9;
    const t1 = Number(document.getElementById('lot1Target').value) || 0;
    
    const rate1 = totalHrs > 0 ? Math.round(t1 / totalHrs) : 0;
    document.getElementById('rateLot1Display').innerText = `Rate: ${rate1} ชิ้น/ชม.`;
    document.getElementById('totalTargetDisplay').innerText = t1.toLocaleString();
  }

  // เรียกใช้เริ่มต้นสำหรับ 9 ชม.
  updateLot1HoursDropdown(9);

  document.getElementById('tgForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const lineVal = document.getElementById('lineSelect').value;
    const lot1No = document.getElementById('lot1No').value.trim().toUpperCase();
    const lot1Target = Number(document.getElementById('lot1Target').value) || 0;
    const manpowerRaw = document.getElementById('manpower').value.trim();
    const manpower = Number(manpowerRaw);
    const totalHrs = Number(document.getElementById('selectedTotalHours').value) || 9;
    const btnSubmit = document.getElementById('btnSubmit');

    if (!lineVal || !lot1No || manpowerRaw === '') {
      alert("กรุณากรอกข้อมูลให้ครบถ้วน");
      return;
    }

    // รองรับจำนวนคนเป็นจำนวนเต็มหรือครึ่งคน เช่น 31, 31.5, 32
    if (!Number.isFinite(manpower) || manpower < 0 || !Number.isInteger(manpower * 2)) {
      alert("จำนวนคนต้องเป็นเลขจำนวนเต็มหรือ .5 เช่น 31 หรือ 31.5");
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.innerText = "กำลังบันทึก...";

    const payload = {
      action: "TG_FORM",
      line: lineVal,
      lotNumber: lot1No,
      target: lot1Target,
      manpower: manpower,
      workingHours: totalHrs,
      updatedBy: userDisplayName
    };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();

      if (result.status === "success") {
        alert("บันทึกเป้าหมายการผลิตเรียบร้อยแล้ว!");
        if (typeof liff !== "undefined" && liff.isInClient()) {
          liff.closeWindow();
        }
      } else {
        alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
      }
    } catch (err) {
      alert("บันทึกไม่สำเร็จ: " + err.message);
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "บันทึกเป้าหมาย";
    }
  });
</script>

</body>
</html>
