<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดรายชั่วโมง</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
      background-color: #F8FAFC; 
      color: #0F172A;
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-center">

  <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-xl space-y-4">
    
    <!-- Header -->
    <div class="text-center pb-2 border-b border-slate-100">
      <h1 class="text-xl font-bold text-slate-800 tracking-wide">⏱️ รายงานยอดรายชั่วโมง</h1>
      <p class="text-xs text-slate-400 mt-1">บันทึกผลการผลิตจริงประจำรอบเวลา</p>
    </div>

    <!-- Alert / Status Banner -->
    <div id="statusBanner" class="hidden p-3 rounded-xl text-xs font-medium"></div>

    <form id="hourlyForm" onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- 1. LINE Dropdown -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">LINE การผลิต <span class="text-rose-500">*</span></label>
        <div class="relative">
          <select id="lineCode" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 appearance-none focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none text-sm" onchange="loadLineInfo()" required>
            <option value="" disabled selected>-- เลือก LINE --</option>
            <option value="B">LINE B</option>
            <option value="C">LINE C</option>
            <option value="D">LINE D</option>
            <option value="E">LINE E</option>
            <option value="F">LINE F</option>
            <option value="G">LINE G</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 text-xs">▼</div>
        </div>
      </div>

      <!-- 2. วันที่ & รอบเวลา (Auto & Locked) -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">วันที่ (อัตโนมัติ)</label>
          <input type="text" id="reportDate" class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium text-slate-500 cursor-not-allowed" readonly>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">รอบเวลา (อัตโนมัติ)</label>
          <input type="text" id="timeSlot" class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-emerald-600 cursor-not-allowed" readonly>
        </div>
      </div>

      <!-- 3. ข้อมูลเป้าหมาย (แสดงอัตโนมัติเมื่อเลือก LINE) -->
      <div id="infoCard" class="hidden p-4 bg-slate-50 border border-emerald-200/80 rounded-2xl space-y-2 text-xs">
        <div class="flex justify-between items-center border-b border-slate-200/60 pb-1.5">
          <span class="text-slate-500">LOT / Model</span>
          <span id="infoLotModel" class="font-bold text-slate-800 text-xs">-</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-500">เป้าหมายชั่วโมงนี้ (Target/hr)</span>
          <span id="infoTargetHr" class="font-bold text-emerald-600 text-base">- ชิ้น</span>
        </div>
      </div>

      <!-- 4. Output/hr -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Output / hr (ยอดทำได้จริง) <span class="text-rose-500">*</span></label>
        <input type="number" id="outputActual" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-2xl text-emerald-600 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none placeholder:text-slate-300 placeholder:font-normal placeholder:text-base" placeholder="กรอกจำนวนชิ้น" required>
      </div>

      <!-- 5. Note -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Note (หมายเหตุ / เหตุผลชะลอตัว)</label>
        <textarea id="note" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none placeholder:text-slate-300" placeholder="ระบุเหตุผลกรณีไม่ได้ตามเป้า (ถ้ามี)"></textarea>
      </div>

      <!-- 6. Action Buttons -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button type="button" onclick="liff.closeWindow()" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition-all active:scale-95 text-sm">CANCEL</button>
        <button type="submit" id="btnSave" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl shadow-lg shadow-emerald-500/25 transition-all active:scale-95 text-sm">SAVE</button>
      </div>

    </form>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4H63RSf2ly6MjSZZErqHaB9-t_1kwBXRPLo5QAPxDh1OE76_rLGSVvya2cgvkvKJX/exec"; // 🔴 ใส่ URL ของ Apps Script
    const LIFF_ID = "2011198724-JQ60DTBm";         // 🔴 ใส่ LIFF ID ตัวใหม่สำหรับ Hourly

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. ตั้งค่า วันที่ อัตโนมัติ
      const now = new Date();
      document.getElementById('reportDate').value = now.toISOString().split('T')[0];

      // 2. คำนวณ รอบเวลา อัตโนมัติ (เช่น 10:00 - 11:00)
      const currentHour = now.getHours();
      const nextHour = currentHour + 1;
      const startStr = String(currentHour).padStart(2, '0') + ":00";
      const endStr = String(nextHour).padStart(2, '0') + ":00";
      document.getElementById('timeSlot').value = `${startStr} - ${endStr}`;

      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (err) { console.error("LIFF Init Error", err); }
    });

    async function loadLineInfo() {
      const line = document.getElementById('lineCode').value;
      if (!line) return;

      const infoCard = document.getElementById('infoCard');
      const banner = document.getElementById('statusBanner');
      banner.classList.add('hidden');

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getHourlyInfo&line=${line}`);
        const data = await res.json();

        if (data.error) {
          infoCard.classList.add('hidden');
          banner.className = "p-3 rounded-xl text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200 block";
          banner.innerText = `⚠️ ${data.error}`;
          document.getElementById('btnSave').disabled = true;
          return;
        }

        document.getElementById('btnSave').disabled = false;
        infoCard.classList.remove('hidden');
        document.getElementById('infoLotModel').innerText = `${data.lotNumber} (${data.model})`;
        document.getElementById('infoTargetHr').innerText = `${Number(data.targetPerHour).toLocaleString()} ชิ้น`;

      } catch (err) {
        console.error("Fetch info error", err);
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      let profileName = "Unknown";
      if (liff.isLoggedIn()) {
        try {
          const profile = await liff.getProfile();
          profileName = profile.displayName;
        } catch (err) { console.error(err); }
      }

      const payload = {
        action: 'saveHourlyOutput',
        line: document.getElementById('lineCode').value,
        timeSlot: document.getElementById('timeSlot').value,
        outputActual: Number(document.getElementById('outputActual').value),
        note: document.getElementById('note').value.trim(),
        updatedBy: profileName
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        alert("บันทึกยอดรายชั่วโมงเรียบร้อย!");
        liff.closeWindow();
      } catch (err) {
        alert("บันทึกไม่สำเร็จ: " + err.message);
        btn.disabled = false;
        btn.innerText = "SAVE";
      }
    }
  </script>
</body>
</html>
