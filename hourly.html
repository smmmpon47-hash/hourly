<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดการผลิตรายชั่วโมง</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #7f8c8d; font-size: 0.9em; margin-top: 0; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 0.9em; }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
    .slot-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; background: #fafafa; padding: 10px; border-radius: 6px; border-left: 4px solid #2ec4b6; }
    .slot-time { flex: 2; font-weight: bold; color: #2c3e50; font-size: 0.85em; }
    .slot-lot { flex: 2; }
    .slot-input { flex: 2; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-submit { background-color: #2ec4b6; color: white; }
    .btn-cancel { background-color: #e74c3c; color: white; }
    .info-box { background-color: #e8f8f5; border: 1px solid #a3e4d7; color: #16a085; padding: 10px; border-radius: 6px; font-size: 0.85em; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>บันทึกยอดการผลิต</h2>
  <p class="subtitle">Hourly Production Output</p>

  <form id="hourlyForm">
    <div class="form-group">
      <label for="line">LINE</label>
      <select id="line" required onchange="loadLineDetails()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <div id="lineSummaryInfo" class="info-box" style="display: none;">
      เป้ารวมประจำวัน: <strong id="infoTarget">0</strong> ชิ้น | ชั่วโมงรวม: <strong id="infoHours">0</strong> ชม.
    </div>

    <!-- Container สำหรับเจนรายการชั่วโมงอัตโนมัติ -->
    <div class="form-group">
      <label>รายการยอดผลิตรายชั่วโมง</label>
      <div id="slotsContainer">
        <p style="color: #999; font-size: 0.85em; text-align: center;">กรุณาเลือก Line เพื่อโหลดรายการชั่วโมง</p>
      </div>
    </div>

    <div class="form-group">
      <label for="remark">หมายเหตุ / Note (ถ้ามี)</label>
      <textarea id="remark" rows="2" placeholder="เช่น เครื่องจักรเสีย, วัตถุดิบขาด"></textarea>
    </div>

    <div class="btn-group">
      <button type="button" class="btn btn-cancel" onclick="liff.closeWindow()">CANCEL</button>
      <button type="submit" class="btn btn-submit">SAVE OUTPUT</button>
    </div>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec"; // เปลี่ยน URL ให้ตรงกับ Web App
  let lineProfile = null;
  let activeLots = [];

  // ตารางเวลาสล็อตมาตรฐานประจำวัน
  const DEFAULT_TIME_SLOTS = [
    "08:30 - 09:30",
    "09:30 - 10:30",
    "10:30 - 11:30",
    "11:30 - 12:30",
    "12:30 - 13:30",
    "13:30 - 14:30",
    "14:30 - 15:30",
    "15:30 - 16:30",
    "16:30 - 17:30",
    "17:30 - 18:30 (OT)",
    "18:30 - 19:30 (OT)"
  ];

  async function initLiff() {
    try {
      await liff.init({ liffId: "2011198724-JQ60DTBm" });
      if (liff.isLoggedIn()) {
        lineProfile = await liff.getProfile();
      } else {
        liff.login();
      }
    } catch (err) {
      console.error("LIFF Init Error:", err);
    }
  }
  initLiff();

  async function loadLineDetails() {
    const line = document.getElementById('line').value;
    const slotsContainer = document.getElementById('slotsContainer');
    const infoBox = document.getElementById('lineSummaryInfo');

    if (!line) {
      slotsContainer.innerHTML = '<p style="color: #999; font-size: 0.85em; text-align: center;">กรุณาเลือก Line เพื่อโหลดรายการชั่วโมง</p>';
      infoBox.style.display = 'none';
      return;
    }

    slotsContainer.innerHTML = '<p style="color: #666; font-size: 0.85em; text-align: center;">กำลังโหลดข้อมูล...</p>';

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      activeLots = data.lots || [];
      const totalHours = data.totalWorkingHours || 8;

      document.getElementById('infoTarget').innerText = data.target || 0;
      document.getElementById('infoHours').innerText = totalHours;
      infoBox.style.display = 'block';

      generateTimeSlots(totalHours);

    } catch (err) {
      console.error("Error loading line details:", err);
      slotsContainer.innerHTML = '<p style="color: red; font-size: 0.85em; text-align: center;">โหลดข้อมูลไม่สำเร็จ</p>';
    }
  }

  function generateTimeSlots(totalHours) {
    const slotsContainer = document.getElementById('slotsContainer');
    slotsContainer.innerHTML = '';

    // สร้างสล็อตตามจำนวนชั่วโมงรวมที่คำนวณได้
    const count = Math.min(Math.ceil(totalHours), DEFAULT_TIME_SLOTS.length);

    if (count === 0) {
      slotsContainer.innerHTML = '<p style="color: #e74c3c; font-size: 0.85em; text-align: center;">ยังไม่มีการบันทึกเป้าประจำวัน (TG)</p>';
      return;
    }

    for (let i = 0; i < count; i++) {
      const timeLabel = DEFAULT_TIME_SLOTS[i] || `ชั่วโมงที่ ${i + 1}`;
      
      let lotOptionsHTML = '';
      if (activeLots.length > 0) {
        lotOptionsHTML = activeLots.map(lot => `<option value="${lot}">${lot}</option>`).join('');
      } else {
        lotOptionsHTML = '<option value="">-</option>';
      }

      const row = document.createElement('div');
      row.className = 'slot-row';
      row.innerHTML = `
        <div class="slot-time">${timeLabel}</div>
        <div class="slot-lot">
          <select class="input-slot-lot">
            ${lotOptionsHTML}
          </select>
        </div>
        <div class="slot-input">
          <input type="number" class="input-slot-val" placeholder="ยอดผลิต" min="0">
        </div>
      `;
      slotsContainer.appendChild(row);
    }
  }

  document.getElementById('hourlyForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const line = document.getElementById('line').value;
    const remark = document.getElementById('remark').value;
    const slotRows = document.querySelectorAll('.slot-row');
    
    const hourlyDetails = [];

    slotRows.forEach(row => {
      const timeLabel = row.querySelector('.slot-time').innerText;
      const lot = row.querySelector('.input-slot-lot').value;
      const outputVal = row.querySelector('.input-slot-val').value;

      if (outputVal !== "" && outputVal !== null) {
        hourlyDetails.push({
          timeLabel: timeLabel,
          lot: lot,
          output: Number(outputVal)
        });
      }
    });

    if (hourlyDetails.length === 0) {
      alert("กรุณากรอกยอดผลิตอย่างน้อย 1 ช่องเวลา");
      return;
    }

    const payload = {
      formType: "OUTPUT_FORM",
      line: line,
      remark: remark,
      hourlyDetails: hourlyDetails,
      updatedBy: lineProfile ? lineProfile.displayName : "Unknown"
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === 'success') {
        alert("บันทึกยอดการผลิตสำเร็จ!");
        liff.closeWindow();
      } else {
        alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      console.error(err);
    }
  });
</script>

</body>
</html>
