<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดรายชั่วโมง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #0F172A; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-center">

  <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-xl space-y-4">
    <!-- Header -->
    <div class="text-center pb-2 border-b border-slate-100">
      <div class="inline-flex p-3 rounded-full bg-sky-50 text-sky-600 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-800 tracking-wide">⏱️ บันทึกยอดรายชั่วโมง</h1>
      <p class="text-xs text-slate-400 mt-0.5">Output / Hour Report</p>
    </div>

    <form id="hourlyForm" class="space-y-3.5" onsubmit="event.preventDefault(); submitForm();">
      
      <!-- LINE Select -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">เลือก Production Line <span class="text-rose-500">*</span></label>
        <div class="relative">
          <select id="lineSelect" onchange="loadLineInfo()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 appearance-none focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all outline-none text-sm" required>
            <option value="" disabled selected>-- เลือก LINE การผลิต --</option>
            <option value="B">LINE B</option>
            <option value="C">LINE C</option>
            <option value="D">LINE D</option>
            <option value="E">LINE E</option>
            <option value="F">LINE F</option>
            <option value="G">LINE G</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 text-xs">▼</div>
        </div>
      </div>

      <!-- Lot & Target Info Box -->
      <div id="infoBox" class="hidden p-3.5 bg-slate-50 border border-sky-200 rounded-2xl space-y-1.5 text-xs">
        <div class="flex justify-between items-center border-b border-slate-200 pb-1.5">
          <span class="text-slate-500">LOT No.</span>
          <span id="dispLot" class="font-bold text-slate-800 uppercase text-xs">-</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-200 pb-1.5">
          <span class="text-slate-500">รุ่น (Model)</span>
          <span id="dispModel" class="font-bold text-slate-800 text-xs">-</span>
        </div>
        <div class="flex justify-between items-center pt-0.5">
          <span class="text-slate-500">เป้าหมายประจำชั่วโมง</span>
          <span id="dispTargetHr" class="font-bold text-sky-600 text-sm">- ชิ้น/ชม.</span>
        </div>
      </div>

      <!-- Time Slot Select -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">รอบเวลา (Time Slot) <span class="text-rose-500">*</span></label>
        <div class="relative">
          <select id="timeSlot" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-800 appearance-none focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all outline-none text-sm" required>
            <option value="" disabled selected>-- เลือกรอบเวลา --</option>
            <option value="08:00 - 09:00">08:00 - 09:00</option>
            <option value="09:00 - 10:00">09:00 - 10:00</option>
            <option value="10:00 - 11:00">10:00 - 11:00</option>
            <option value="11:00 - 12:00">11:00 - 12:00</option>
            <option value="13:00 - 14:00">13:00 - 14:00</option>
            <option value="14:00 - 15:00">14:00 - 15:00</option>
            <option value="15:00 - 16:00">15:00 - 16:00</option>
            <option value="16:00 - 17:00">16:00 - 17:00</option>
            <option value="17:00 - 18:00">17:00 - 18:00 (OT)</option>
            <option value="18:00 - 19:00">18:00 - 19:00 (OT)</option>
            <option value="19:00 - 20:00">19:00 - 20:00 (OT)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 text-xs">▼</div>
        </div>
      </div>

      <!-- Actual Output Input -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ยอดผลิตจริงประจำรอบนี้ (ชิ้น) <span class="text-rose-500">*</span></label>
        <input type="number" id="outputActual" placeholder="กรอกจำนวนชิ้นงาน" min="0" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-lg text-sky-600 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all outline-none text-sm">
      </div>

      <!-- Note Input -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุ / ปัญหาที่พบ (ถ้ามี)</label>
        <textarea id="note" rows="2" placeholder="เช่น เครื่องจักรขัดข้อง 10 นาที" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-700 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all outline-none text-sm"></textarea>
      </div>

      <!-- Buttons -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button type="button" onclick="if(liff.isInClient()) liff.closeWindow()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition-all active:scale-95 text-sm">CANCEL</button>
        <button type="submit" id="btnSubmit" class="w-full py-3 bg-sky-500 hover:bg-sky-600 text-white font-semibold rounded-xl shadow-lg shadow-sky-500/25 transition-all active:scale-95 text-sm">SAVE</button>
      </div>

    </form>
  </div>

  <script>
    const LIFF_ID = '2011198724-JQ60DTBm';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec';

    let userDisplayName = 'Unknown';

    window.onload = function () {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              userDisplayName = profile.displayName;
            });
          }
        })
        .catch(err => console.error('LIFF Init Error:', err));
    };

    function loadLineInfo() {
      const line = document.getElementById('lineSelect').value;
      if (!line) return;

      Swal.showLoading();
      fetch(`${WEB_APP_URL}?action=getHourlyInfo&line=${line}`)
        .then(res => res.json())
        .then(data => {
          Swal.close();
          if (data.error) {
            Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: data.error, confirmButtonColor: '#0284C7' });
            document.getElementById('infoBox').classList.add('hidden');
          } else {
            document.getElementById('dispLot').innerText = data.lotNumber || '-';
            document.getElementById('dispModel').innerText = data.model || '-';
            document.getElementById('dispTargetHr').innerText = `${data.targetPerHour} ชิ้น/ชม.`;
            document.getElementById('infoBox').classList.remove('hidden');
          }
        })
        .catch(err => {
          Swal.close();
          console.error(err);
        });
    }

    function submitForm() {
      const line = document.getElementById('lineSelect').value;
      const timeSlot = document.getElementById('timeSlot').value;
      const outputActual = document.getElementById('outputActual').value;
      const note = document.getElementById('note').value;

      if (!line || !timeSlot || !outputActual) {
        Swal.fire({ icon: 'warning', title: 'กรอกข้อมูลไม่ครบ', text: 'กรุณากรอกข้อมูลให้ครบถ้วน', confirmButtonColor: '#0284C7' });
        return;
      }

      const payload = {
        action: 'saveHourlyOutput',
        line: line,
        timeSlot: timeSlot,
        outputActual: Number(outputActual),
        note: note,
        updatedBy: userDisplayName
      };

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.innerText = 'SAVE';

        if (data.status === 'duplicate') {
          Swal.fire({ icon: 'warning', title: 'ไม่สามารถบันทึกได้', text: data.message, confirmButtonColor: '#0284C7' });
        } else if (data.status === 'success') {
          Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', text: 'บันทึกยอดรายชั่วโมงเรียบร้อยแล้ว', timer: 1800, confirmButtonColor: '#0284C7' }).then(() => {
            if (liff.isInClient()) liff.closeWindow();
          });
        } else {
          Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: data.error || 'ไม่สามารถบันทึกข้อมูลได้', confirmButtonColor: '#0284C7' });
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = 'SAVE';
        Swal.fire({ icon: 'error', title: 'Error', text: err.message, confirmButtonColor: '#0284C7' });
      });
    }
  </script>
</body>
</html>
