<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดรายชั่วโมง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; } </style>
</head>
<body class="flex justify-center min-h-screen p-4 pt-6 pb-12 items-start">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 sm:p-7 border border-slate-100 mt-2">
    
    <div class="text-center mb-5">
      <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-800">บันทึกยอดรายชั่วโมง</h2>
      <p class="text-xs text-slate-400 font-medium">Hourly Production Output</p>
    </div>

    <form id="outputForm" onsubmit="submitData(event)" class="space-y-4">
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">LINE</label>
        <select id="lineSelect" required onchange="fetchLineData()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">-- เลือก LINE --</option>
          <option value="B">Line B</option>
          <option value="C">Line C</option>
          <option value="D">Line D</option>
          <option value="E">Line E</option>
          <option value="F">Line F</option>
          <option value="G">Line G</option>
        </select>
      </div>

      <div id="targetInfoCard" class="hidden bg-emerald-50/60 border border-emerald-100 rounded-2xl p-3.5 text-sm text-emerald-900">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs text-emerald-600 font-medium">เป้าหมายประจำวัน (TG)</span>
          <span id="displayTgTarget" class="font-bold text-base text-emerald-700">0 ชิ้น</span>
        </div>
        <div class="text-xs text-slate-500 flex items-center gap-1">
          <span>LOT ในระบบ:</span>
          <span id="displayLotList" class="font-semibold text-slate-700 truncate">-</span>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">เลือกรอบเวลา</label>
        <select id="timeRangeSelect" required onchange="renderTimeSlots()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">-- เลือกรอบเวลา --</option>
          <option value="1">08:30 - 10:30 (รอบ 1)</option>
          <option value="2">10:30 - 12:30 (รอบ 2)</option>
          <option value="3">12:30 - 14:30 (รอบ 3)</option>
          <option value="4">14:30 - 16:30 (รอบ 4)</option>
          <option value="5">16:30 - 17:30 (รอบ 5 - จบกะปกติ)</option>
        </select>
      </div>

      <div id="hourlySlotsContainer" class="space-y-3 pt-1"></div>

      <div id="totalSummaryCard" class="hidden bg-slate-100 border border-slate-200 rounded-xl p-3.5 flex justify-between items-center">
        <span class="text-sm font-bold text-slate-700">รวมยอดผลิตรอบนี้:</span>
        <span class="text-xl font-extrabold text-emerald-600"><span id="sumOutput">0</span> <span class="text-xs font-normal text-slate-500">ชิ้น</span></span>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">หมายเหตุ / ปัญหาที่พบ (ถ้ามี)</label>
        <textarea id="remark" rows="2" placeholder="เช่น เครื่องจักรขัดข้อง 15 นาที..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" onclick="window.close()" class="w-1/2 bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl text-base">CANCEL</button>
        <button type="submit" id="submitBtn" class="w-1/2 bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-200 text-base">SAVE</button>
      </div>

    </form>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec";
    let availableLots = [];

    const timeSlotsMap = {
      "1": [ { label: "08:30 - 09:30" }, { label: "09:30 - 10:30" } ],
      "2": [ { label: "10:30 - 11:30" }, { label: "11:30 - 12:30" } ],
      "3": [ { label: "12:30 - 13:30" }, { label: "13:30 - 14:30" } ],
      "4": [ { label: "14:30 - 15:30" }, { label: "15:30 - 16:30" } ],
      "5": [ { label: "16:30 - 17:30" } ],
      "OT1": [ { label: "17:30 - 18:30" } ],
      "OT2": [ { label: "18:30 - 19:30" } ]
    };

    function fetchLineData() {
      const line = document.getElementById('lineSelect').value;
      if (!line) return;

      fetch(`${WEB_APP_URL}?line=${line}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('targetInfoCard').classList.remove('hidden');
          document.getElementById('displayTgTarget').innerText = Number(data.target).toLocaleString() + " ชิ้น";
          availableLots = data.lots.length > 0 ? data.lots : ["ไม่มี LOT"];
          document.getElementById('displayLotList').innerText = availableLots.join(', ');

          // ปลดล็อก OT ถ้า Working Hours เกิน 8
          if (data.workingHours > 8) {
            const select = document.getElementById('timeRangeSelect');
            if (!select.querySelector('option[value="OT1"]')) {
              select.insertAdjacentHTML('beforeend', '<option value="OT1">17:30 - 18:30 (OT 1)</option>');
            }
          }
          renderTimeSlots();
        });
    }

    function renderTimeSlots() {
      const selectedRound = document.getElementById('timeRangeSelect').value;
      const container = document.getElementById('hourlySlotsContainer');
      container.innerHTML = "";

      if (!selectedRound || !timeSlotsMap[selectedRound]) {
        document.getElementById('totalSummaryCard').classList.add('hidden');
        return;
      }

      document.getElementById('totalSummaryCard').classList.remove('hidden');
      const slots = timeSlotsMap[selectedRound];

      slots.forEach((slot, index) => {
        const lotOptions = availableLots.map(lot => `<option value="${lot}">${lot}</option>`).join('');
        const html = `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3">
            <div class="text-xs font-bold text-emerald-600 mb-1.5 flex justify-between">
              <span>⏱️ ช่วงเวลา ${slot.label}</span>
              <span class="text-slate-400 font-normal">Output/hr</span>
            </div>
            <div class="flex gap-2">
              <select id="slotLot_${index}" class="w-1/2 bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-sm font-semibold text-slate-700">
                ${lotOptions}
              </select>
              <input type="number" id="slotVal_${index}" oninput="calculateTotal()" placeholder="ยอดผลิต (ชิ้น)" required min="0" class="w-1/2 bg-white border border-slate-200 rounded-xl px-3 py-2 text-base font-bold text-slate-800 text-right">
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
      calculateTotal();
    }

    function calculateTotal() {
      let sum = 0;
      document.querySelectorAll('[id^="slotVal_"]').forEach(i => sum += (parseInt(i.value) || 0));
      document.getElementById('sumOutput').innerText = sum.toLocaleString();
    }

    function submitData(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      const selectedRound = document.getElementById('timeRangeSelect').value;
      const slots = timeSlotsMap[selectedRound];

      const hourlyData = slots.map((slot, index) => ({
        timeLabel: slot.label,
        lot: document.getElementById(`slotLot_${index}`).value,
        output: parseInt(document.getElementById(`slotVal_${index}`).value) || 0
      }));

      const payload = {
        formType: "OUTPUT_FORM",
        line: document.getElementById('lineSelect').value,
        hourlyDetails: hourlyData,
        remark: document.getElementById('remark').value
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("บันทึกยอดรายชั่วโมงสำเร็จ!");
        btn.disabled = false;
        btn.innerText = "SAVE";
        document.getElementById('outputForm').reset();
        document.getElementById('hourlySlotsContainer').innerHTML = "";
        document.getElementById('totalSummaryCard').classList.add('hidden');
        document.getElementById('targetInfoCard').classList.add('hidden');
      });
    }
  </script>
</body>
</html>
