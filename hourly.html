<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกยอดการผลิต</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body {
      background-color: #1e3a3f;
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .card {
      background: #ffffff;
      padding: 24px 22px;
      border-radius: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    /* จัดวาง Header และ Date ใหม่ไม่ให้ทับกัน */
    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: #0d9488;
      margin: 0;
    }
    .date-badge {
      font-size: 0.85rem;
      color: #475569;
      font-weight: 600;
      background: #f1f5f9;
      padding: 5px 12px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }
    .sub-header {
      font-size: 0.88rem;
      color: #64748b;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b; font-size: 1rem; }
    
    /* ปรับช่อง Input และ Select ให้ใหญ่ขึ้น */
    select, input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.8px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.05rem;
      outline: none;
      background: #fff;
      color: #0f172a;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.2);
    }

    .info-banner {
      background: #e0f2fe;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #0369a1;
      font-weight: 600;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 12px;
    }

    /* แถวรายการรอบเวลา - ขยายขนาดขึ้น */
    .slot-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .slot-time {
      flex: 2.2;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 11px 8px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
    }
    .slot-lot-select {
      flex: 2;
      padding: 11px 8px;
      font-size: 0.95rem;
      border-radius: 14px;
      font-weight: 500;
    }
    .slot-input {
      flex: 1.4;
      padding: 11px 8px;
      text-align: center;
      font-weight: 700;
      border-radius: 14px;
      font-size: 1.1rem;
    }

    /* แถบเตือน "กรอกไปแล้ว" ใต้แต่ละช่วงเวลาที่เคยมีคนกรอกไปแล้ว */
    .slot-warning {
      font-size: 0.78rem;
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 6px 10px;
      margin: -6px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* สรุปผลรวม */
    .sum-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 14px 18px;
      border-radius: 16px;
      border: 2px dashed #0d9488;
      margin-top: 15px;
      font-weight: 600;
      color: #1e293b;
      font-size: 1.05rem;
    }
    .sum-input {
      width: 95px;
      text-align: center;
      background: #fff;
      font-weight: 700;
      color: #0d9488;
      border: 2px solid #0d9488;
      padding: 6px;
      border-radius: 10px;
      font-size: 1.15rem;
    }

    /* การ์ดแสดง Target Output / hr */
    .target-rate-box {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #166534;
      font-weight: 600;
    }
    .target-rate-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #15803d;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
      margin-top: 5px;
    }
    .btn-submit:active { background: #0f766e; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-top-row">
    <h2 class="header-title">บันทึกยอดการผลิต</h2>
    <div class="date-badge" id="currentDateDisplay">--/--/----</div>
  </div>
  <div class="sub-header">Hourly Production Output Record</div>

  <form id="hourlyForm">
    <div class="form-group">
      <label for="line">LINE การผลิต</label>
      <select id="line" required onchange="loadLineDetails()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <div id="infoBanner" class="info-banner" style="display:none;">
      <span>🎯 เป้าวัน: <strong id="targetVal">0</strong> ชิ้น</span>
      <span>⏱️ เวลาทำงาน: <strong id="hoursVal">0</strong> ชม.</span>
    </div>

    <div class="form-group">
      <div class="section-title">กรอกยอดผลิตรายชั่วโมง</div>
      <div id="slotsContainer">
        <p style="color: #94a3b8; font-size: 0.95rem; text-align: center; padding: 15px 0;">โปรดเลือก LINE การผลิต</p>
      </div>
    </div>

    <!-- ช่องสรุปรวม -->
    <div class="sum-box">
      <span>ยอดรวมที่กรอก</span>
      <input type="text" id="totalSum" class="sum-input" value="0" readonly>
      <span>ชิ้น</span>
    </div>

    <!-- ส่วนเทียบ Target Rate ต่อชั่วโมง -->
    <div class="target-rate-box" id="targetRateBox" style="display:none;">
      <span>เป้าหมายเฉลี่ย (Output/hr):</span>
      <span class="target-rate-val"><span id="targetPerHourVal">0</span> ชิ้น/ชม.</span>
    </div>

    <div class="form-group">
      <label for="remark">หมายเหตุ / ปัญหาที่พบ</label>
      <textarea id="remark" rows="2" placeholder="ระบุปัญหาที่พบ (ถ้ามี)"></textarea>
    </div>

    <button type="submit" class="btn-submit">บันทึกยอด</button>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwziSYLaDcymEHVXQr_qOP6RmIQDjixVPqWwhAQSOMXs_4zAA-gscpeuR7fJp7DY6yp/exec"; 
  let lineProfile = null;
  let activeLots = [];
  let activeExistingHourly = {};

  const TIME_SLOTS_DEF = [
    { label: "08.30-09.30", endMin: 570 },
    { label: "09.30-10.30", endMin: 630 },
    { label: "10.30-11.30", endMin: 690 },
    { label: "11.30-12.30", endMin: 750 },
    { label: "12.30-13.30", endMin: 810 },
    { label: "13.30-14.30", endMin: 870 },
    { label: "14.30-15.30", endMin: 930 },
    { label: "15.30-16.30", endMin: 990 },
    { label: "16.30-17.30", endMin: 1050 },
    { label: "17.30-18.30", endMin: 1110 },
    { label: "18.30-19.30", endMin: 1170 }
  ];

  function displayCurrentDate() {
    const now = new Date();
    const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
    document.getElementById('currentDateDisplay').innerText = now.toLocaleDateString('th-TH', options);
  }
  displayCurrentDate();

  async function initLiff() {
    try {
      await liff.init({ liffId: "2011198724-JQ60DTBm" });
      if (liff.isLoggedIn()) { lineProfile = await liff.getProfile(); }
      else { liff.login(); }
    } catch (err) { console.error("LIFF Init Error:", err); }
  }
  initLiff();

  async function loadLineDetails() {
    const line = document.getElementById('line').value;
    const slotsContainer = document.getElementById('slotsContainer');
    const infoBanner = document.getElementById('infoBanner');
    const targetRateBox = document.getElementById('targetRateBox');

    if (!line) {
      slotsContainer.innerHTML = '<p style="color: #94a3b8; font-size: 0.95rem; text-align: center; padding: 15px 0;">โปรดเลือก LINE การผลิต</p>';
      infoBanner.style.display = 'none';
      targetRateBox.style.display = 'none';
      return;
    }

    slotsContainer.innerHTML = '<p style="color: #64748b; font-size: 0.95rem; text-align: center; padding: 15px 0;">กำลังโหลดข้อมูล...</p>';

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      activeLots = data.lots || [];
      activeExistingHourly = data.existingHourly || {};
      const totalHours = Number(data.totalWorkingHours) || 8;
      const targetVal = Number(data.target) || 0;

      if (data.reported) {
        document.getElementById('targetVal').innerText = targetVal.toLocaleString();
        document.getElementById('hoursVal').innerText = totalHours;
        infoBanner.style.display = 'flex';

        // คำนวณ Output / hr
        const targetPerHour = totalHours > 0 ? Math.round(targetVal / totalHours) : 0;
        document.getElementById('targetPerHourVal').innerText = targetPerHour.toLocaleString();
        targetRateBox.style.display = 'flex';
      } else {
        infoBanner.style.display = 'none';
        targetRateBox.style.display = 'none';
      }

      generateSmartTimeSlots(totalHours);
    } catch (err) {
      console.error("Error loading line details:", err);
      slotsContainer.innerHTML = '<p style="color: #ef4444; font-size: 0.95rem; text-align: center;">โหลดข้อมูลไม่สำเร็จ</p>';
    }
  }

  function generateSmartTimeSlots(totalHours) {
    const slotsContainer = document.getElementById('slotsContainer');
    slotsContainer.innerHTML = '';

    const now = new Date();
    const currentMinutes = (now.getHours() * 60) + now.getMinutes();

    let passedSlots = TIME_SLOTS_DEF.filter(slot => currentMinutes >= slot.endMin);
    const maxCount = Math.min(Math.ceil(totalHours), TIME_SLOTS_DEF.length);
    passedSlots = passedSlots.slice(0, maxCount);

    let targetSlots = [];
    if (passedSlots.length > 0) {
      targetSlots = passedSlots.slice(-2);
    } else if (maxCount > 0) {
      targetSlots = [TIME_SLOTS_DEF[0]];
    }

    if (targetSlots.length === 0) {
      slotsContainer.innerHTML = '<p style="color: #ef4444; font-size: 0.95rem; text-align: center; padding: 15px 0;">ยังไม่ได้ตั้งเป้าผลิตประจำวัน (TG)</p>';
      return;
    }

    let lotOptionsHTML = activeLots.length > 0 
      ? activeLots.map(lot => `<option value="${lot}">${lot}</option>`).join('') 
      : '<option value="">-</option>';

    targetSlots.forEach(slot => {
      const existing = activeExistingHourly[slot.label]; // {output, lot, reportedBy, time} ถ้าเคยกรอกไปแล้ว

      const row = document.createElement('div');
      row.className = 'slot-row';
      row.innerHTML = `
        <div class="slot-time">${slot.label}</div>
        <select class="slot-lot-select input-lot-val">
          ${lotOptionsHTML}
        </select>
        <input type="number" class="slot-input input-val" min="0" placeholder="0" oninput="calculateTotal()">
      `;
      slotsContainer.appendChild(row);

      if (existing) {
        // pre-fill ค่าที่เคยกรอกไว้ + เลือก LOT เดิมให้อัตโนมัติ (ถ้ามีใน dropdown)
        const inputEl = row.querySelector('.input-val');
        const lotSelectEl = row.querySelector('.input-lot-val');
        inputEl.value = existing.output;
        if (existing.lot && [...lotSelectEl.options].some(o => o.value === existing.lot)) {
          lotSelectEl.value = existing.lot;
        }

        const warning = document.createElement('div');
        warning.className = 'slot-warning';
        warning.innerHTML = `⚠️ ช่วงนี้กรอกไปแล้ว <b>${existing.output}</b> ชิ้น โดย <b>${existing.reportedBy || 'ไม่ทราบชื่อ'}</b> เมื่อ ${existing.time} — แก้ไขได้ถ้าต้องการอัปเดต`;
        slotsContainer.appendChild(warning);
      }
    });

    calculateTotal();
  }

  function calculateTotal() {
    const inputs = document.querySelectorAll('.input-val');
    let total = 0;
    inputs.forEach(input => {
      total += (Number(input.value) || 0);
    });
    document.getElementById('totalSum').value = total.toLocaleString();
  }

  document.getElementById('hourlyForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const line = document.getElementById('line').value;
    const remark = document.getElementById('remark').value;
    const slotRows = document.querySelectorAll('.slot-row');
    const hourlyDetails = [];

    slotRows.forEach(row => {
      const timeLabel = row.querySelector('.slot-time').innerText;
      const lotVal = row.querySelector('.input-lot-val').value;
      const outputVal = row.querySelector('.input-val').value;

      if (outputVal !== "" && outputVal !== null) {
        hourlyDetails.push({
          timeLabel: timeLabel,
          lot: lotVal,
          output: Number(outputVal)
        });
      }
    });

    if (hourlyDetails.length === 0) {
      alert("กรุณากรอกยอดผลิตอย่างน้อย 1 ช่องเวลา");
      return;
    }

    const payload = {
      action: "saveHourlyOutput",
      line: line,
      remark: remark,
      hourlyDetails: hourlyDetails,
      updatedBy: lineProfile ? lineProfile.displayName : "Unknown"
    };

    try {
      const res = await fetch(SCRIPT_URL, { 
        method: 'POST', 
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload) 
      });
      const result = await res.json();
      if (result.status === 'success') {
        alert("บันทึกยอดการผลิตเรียบร้อยแล้ว!");
        liff.closeWindow();
      } else {
        alert("เกิดข้อผิดพลาด: " + result.error);
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      console.error(err);
    }
  });
</script>

</body>
</html>
